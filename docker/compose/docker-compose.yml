services:

  ros2-unbag:
    image: ghcr.io/openads-project/ros2_unbag_plugins:${TAG:-latest}
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${BAG_DIR:-./bags}:/bags
    working_dir: /bags
    command:
      - /bin/bash
      - -ic
      - |
        ros2 unbag
