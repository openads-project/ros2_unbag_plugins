name: helm-oci

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  helm-oci:
    # This repository only installs ros2_unbag Python plugins and has no Helm chart to publish.
    if: ${{ false }}
    uses: openads-project/openads-dev-environment/.github/workflows/helm-oci.yml@main
    secrets: inherit
