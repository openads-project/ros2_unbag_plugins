openadservice:
  name: ros2-unbag
  image: ghcr.io/openads-project/ros2_unbag_plugins:v1.0.0
  env:
    DISPLAY: :0
    QT_X11_NO_MITSHM: 1
  volumes:
    # The X11 socket is mounted so ros2_unbag can display its GUI. Override
    # DISPLAY when the X server uses a display other than :0.
    - mountPath: /tmp/.X11-unix
      hostPath: /tmp/.X11-unix
    # Place bag files in this directory on each Kubernetes node, or override
    # the host path during installation.
    - mountPath: /bags
      hostPath: /bags
  args:
    - /bin/bash
    - -ic
    - cd /bags && ros2 unbag
